<div id="en"><h1>Support</h1><p>Questions, feedback or a quote you would love to see? Write to <a href="mailto:enestalhaucar@icloud.com>enestalhaucar@icloud.com</a>.</p><h2>Common questions</h2><p><b>Restore purchases:</b> Settings → Premium → Restore Purchases.<br><b>Cancel a subscription:</b> iOS Settings → your name → Subscriptions → Motivasyon.<br><b>Delete my data:</b> Settings → Privacy → Delete my data.<br><b>Add a widget:</b> Profile → Home Screen widget or Lock Screen widget has a step-by-step guide.</p></div><hr><div id="tr" lang="tr"><h1>Destek</h1><p>Soru, geri bildirim ya da görmek istediğin bir söz mü var? <a href="mailto:enestalhaucar@icloud.com>enestalhaucar@icloud.com</a> adresine yaz.</p><h2>Sık sorulanlar</h2><p><b>Satın almaları geri yükle:</b> Ayarlar → Premium → Satın Alımları Geri Yükle.<br><b>Abonelik iptali:</b> iOS Ayarlar → adın → Abonelikler → Motivasyon.<br><b>Verilerimi sil:</b> Ayarlar → Gizlilik → Verilerimi sil.<br><b>Widget ekle:</b> Profil → Ana ekran widget'ı ya da Kilit ekranı widget'ı, adım adım rehber içerir.</p></div><p><small>Last updated: 19 October 2026 / Son güncelleme: 19 Ekim 2026</small></p></body></html>
